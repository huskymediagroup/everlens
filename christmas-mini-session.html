    <style>
        .glass-nav {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        
        .hero-overlay {
            background: linear-gradient(to right, rgba(59, 62, 64, 0.92) 0%, rgba(59, 62, 64, 0.62) 100%);
        }

        .pricing-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-top: 5px solid #4A4A4A;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .pricing-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: #2a6a96;
        }

        .pricing-card.featured {
            border-top: 5px solid #2F7396;
            transform: scale(1.02);
            box-shadow: 0 15px 40px rgba(47, 115, 150, 0.15);
        }

        .pricing-card.featured:hover {
            transform: scale(1.02) translateY(-5px);
        }

        .popular-badge {
            background-color: #2F7396;
            color: white;
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 5px 15px;
            border-radius: 20px;
            align-self: flex-start;
            margin-bottom: 15px;
        }

        .package-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .package-price {
            font-size: 2.5rem;
            color: #2F7396;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .package-subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }

        .package-features {
            list-style: none;
            padding: 0;
            margin: 0 0 30px 0;
            flex-grow: 1;
        }

        .package-features li {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 15px;
            position: relative;
            padding-left: 25px;
            line-height: 1.4;
        }

        .package-features li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #2F7396;
            font-weight: bold;
        }

        .btn-book {
            display: inline-block;
            text-align: center;
            padding: 15px 25px;
            background-color: #4A4A4A;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.3s;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
        }

        .pricing-card.featured .btn-book {
            background-color: #2F7396;
        }

        .btn-book:hover {
            background-color: #333;
            color: #fff;
        }
        
        .pricing-card.featured .btn-book:hover {
            background-color: #235a77;
        }
    </style>
</head>
